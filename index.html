<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Invoice + PayPal Pay Link</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  label { display: block; margin: .8rem 0 .2rem; font-weight: 600; }
  input, textarea, select { width: 100%; padding: .5rem; font: inherit; }
  button { padding: .6rem 1rem; font: inherit; margin: .6rem .4rem 0 0; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { border-bottom: 1px solid #ccc; padding: .4rem; text-align: left; }
  .warn { background: #fff3cd; padding: .6rem; border-radius: 6px; }
  .ok { background: #d4edda; padding: .6rem; border-radius: 6px; }
  #items td input { width: 100%; }
</style>
</head>
<body>
<h1>AI Invoice + PayPal Pay Link</h1>
<p>Describe the work in plain language. Gemini turns it into invoice line items. PayPal Sandbox turns the invoice into a link the client can actually pay.</p>
<div id="config" class="warn">Checking configuration…</div>

<label>Your name (seller)</label>
<input id="seller" value="Agata Studio">
<label>Client name</label>
<input id="client" value="Acme Corp">
<label>Client email (optional, for the PayPal order)</label>
<input id="clientEmail" placeholder="client@example.com">
<label>Work description</label>
<textarea id="description" rows="4">Designed a logo and a landing page, plus 2 rounds of revisions, delivered this week.</textarea>
<label>Currency</label>
<select id="currency"><option>USD</option><option>EUR</option><option>GBP</option></select>

<div>
  <button id="generate">1. Generate invoice with AI</button>
  <button id="pay" disabled>2. Create PayPal payment link</button>
</div>

<div id="result"></div>
<table id="items" hidden>
  <thead><tr><th>Description</th><th>Qty</th><th>Unit price</th><th>Amount</th></tr></thead>
  <tbody></tbody>
  <tfoot><tr><td colspan="3"><strong>Total</strong></td><td id="total"></td></tr></tfoot>
</table>
<p id="notes"></p>
<div id="payResult"></div>

<script>
let items = [];
async function loadConfig() {
  const c = await (await fetch('/api/config')).json();
  const el = document.getElementById('config');
  el.className = (c.geminiConfigured && c.paypalConfigured) ? 'ok' : 'warn';
  el.textContent = (c.geminiConfigured && c.paypalConfigured)
    ? 'Ready: Gemini and PayPal Sandbox are both configured.'
    : 'Setup needed: ' + (!c.geminiConfigured ? 'GEMINI_API_KEY missing. ' : '') + (!c.paypalConfigured ? 'PAYPAL_CLIENT_ID / PAYPAL_CLIENT_SECRET missing (Sandbox). ' : '') + 'Copy .env.example to .env and fill them in, then restart the server.';
}
loadConfig();

function render() {
  const tbody = document.querySelector('#items tbody');
  tbody.innerHTML = '';
  let total = 0;
  items.forEach((it, i) => {
    const amt = it.quantity * it.unitPrice; total += amt;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><input value="${it.description.replace(/"/g, '&quot;')}" data-i="${i}" data-f="description"></td>
      <td><input type="number" step="1" value="${it.quantity}" data-i="${i}" data-f="quantity"></td>
      <td><input type="number" step="0.01" value="${it.unitPrice}" data-i="${i}" data-f="unitPrice"></td>
      <td>${amt.toFixed(2)}</td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('items').hidden = !items.length;
  document.getElementById('total').textContent = total.toFixed(2);
  document.getElementById('pay').disabled = !items.length;
}
document.querySelector('#items').addEventListener('input', (e) => {
  const i = +e.target.dataset.i, f = e.target.dataset.f;
  items[i][f] = f === 'description' ? e.target.value : Number(e.target.value);
  render();
});

document.getElementById('generate').onclick = async () => {
  const r = await fetch('/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ seller: seller.value, client: client.value, description: description.value, currency: currency.value }) });
  const d = await r.json();
  if (!r.ok) { document.getElementById('result').textContent = 'Error: ' + d.error; return; }
  items = d.items; document.getElementById('notes').textContent = d.notes || '';
  document.getElementById('result').textContent = 'Invoice generated by ' + d.model + '. Edit any line before creating the payment link.';
  render();
};

document.getElementById('pay').onclick = async () => {
  const r = await fetch('/api/create-order', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ items, currency: currency.value, description: description.value, clientEmail: clientEmail.value }) });
  const d = await r.json();
  const el = document.getElementById('payResult');
  if (!r.ok) { el.textContent = 'Error: ' + d.error; return; }
  el.innerHTML = `<p class="ok">PayPal order <strong>${d.orderId}</strong> (${d.status}) — total ${d.total} ${d.currency}.</p>
    <p><a href="${d.approveUrl}" target="_blank" rel="noopener">Pay with PayPal (Sandbox) →</a></p>
    <p>After approving in the Sandbox, check status: <button id="check">Check order status</button> <span id="status"></span></p>`;
  document.getElementById('check').onclick = async () => {
    const s = await (await fetch('/api/order/' + d.orderId)).json();
    document.getElementById('status').textContent = 'Status: ' + s.status + (s.payer ? ' — payer: ' + s.payer : '');
  };
};
</script>
</body>
</html>
